{% if error %}
<div style="padding:16px; background-color:var(--bg-card); border:1px solid var(--danger); border-radius:8px; margin-top:16px;">
    <div style="font-size:0.8rem; color:var(--danger); font-weight:500; margin-bottom:4px;">Summary Failed</div>
    <div style="font-size:0.8rem; color:var(--text-secondary);">{{ error }}</div>
</div>
{% else %}
<div style="padding:16px; background-color:var(--bg-card); border:1px solid var(--success); border-radius:8px; margin-top:16px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <div>
            <span style="font-size:0.65rem; padding:2px 8px; border-radius:4px; background-color:var(--tag-bg); color:var(--success);">Summary Generated</span>
            {% if summary.prompt_name %}
            <span style="font-size:0.65rem; color:var(--text-muted); margin-left:8px;">via {{ summary.prompt_name }}</span>
            {% endif %}
        </div>
        <a href="/sources/{{ source_id }}?step=3" class="btn btn-primary" style="padding:6px 16px; font-size:0.8rem;">
            View in Read & Note &#8594;
        </a>
    </div>
    <div style="font-size:0.85rem; line-height:1.8; color:var(--text-secondary); white-space:pre-wrap; max-height:300px; overflow-y:auto;">{{ summary.content }}</div>
</div>
{% endif %}
