[project]
name = "fastapi-htmx"
version = "0.1.0"
description = "SecondBrain — a knowledge management app with AI-powered connections and writing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.1",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.9.1",
    "uvicorn>=0.49.0",
    "duckdb>=1.3.1",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "docling>=2.0",
    "markdown>=3.8",
    "pytz>=2026.2",
    "pymupdf>=1.27.2.3",
]

[project.optional-dependencies]
export = [
    "python-docx>=1.1",
    "weasyprint>=65.0",
]
dev = [
    "pytest>=8.4",
    "httpx>=0.28",
]
